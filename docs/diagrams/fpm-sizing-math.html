<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP-FPM Sizing Math</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>PHP-FPM: how many children?</h1>
      </div>
      <p class="subtitle">pm.max_children is a memory budget, not a guess</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 600">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <rect x="100" y="50" width="800" height="90" rx="8" fill="#0f172a"/>
        <rect x="100" y="50" width="800" height="90" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="500" y="90" fill="white" font-size="18" font-weight="700" text-anchor="middle">max_children = (RAM for PHP x 0.9) / avg process size</text>
        <text x="500" y="118" fill="#94a3b8" font-size="10" text-anchor="middle">RAM for PHP = total - OS - database - caches - everything else on the box. The 0.9 is your safety buffer.</text>

        <line x1="500" y1="140" x2="500" y2="178" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <rect x="60" y="180" width="420" height="180" rx="8" fill="#0f172a"/>
        <rect x="60" y="180" width="420" height="180" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="270" y="208" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">worked example - 16 GB server</text>
        <text x="90" y="238" fill="#94a3b8" font-size="11">total RAM              16 GB</text>
        <text x="90" y="260" fill="#94a3b8" font-size="11">reserved for PHP       12 GB</text>
        <text x="90" y="282" fill="#94a3b8" font-size="11">safety buffer          x 0.9  = 10.8 GB</text>
        <text x="90" y="304" fill="#94a3b8" font-size="11">avg PHP process        255 MB</text>
        <text x="90" y="336" fill="white" font-size="13" font-weight="700">10,800 / 255  =  ~42 children</text>

        <rect x="520" y="180" width="420" height="180" rx="8" fill="#0f172a"/>
        <rect x="520" y="180" width="420" height="180" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="730" y="208" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">measure, do not guess</text>
        <text x="550" y="238" fill="#94a3b8" font-size="10">avg process size comes from YOUR app under load:</text>
        <text x="550" y="262" fill="#fbbf24" font-size="10">ps -ylC php-fpm --sort:rss   (RSS column)</text>
        <text x="550" y="284" fill="#fbbf24" font-size="10">make fpm-htop   (watch it live)</text>
        <text x="550" y="308" fill="#94a3b8" font-size="10">grafana: Memory Usage per Request panel</text>
        <text x="550" y="336" fill="#94a3b8" font-size="10">a Laravel API child here: ~40 MB. a heavy CMS: 250+ MB</text>

        <rect x="60" y="400" width="420" height="150" rx="8" fill="#0f172a"/>
        <rect x="60" y="400" width="420" height="150" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="270" y="428" fill="#a78bfa" font-size="12" font-weight="600" text-anchor="middle">the supporting knobs</text>
        <text x="90" y="456" fill="#94a3b8" font-size="10">pm = dynamic                scale between spares</text>
        <text x="90" y="478" fill="#94a3b8" font-size="10">pm.start_servers            children at boot</text>
        <text x="90" y="500" fill="#94a3b8" font-size="10">pm.min/max_spare_servers    idle pool bounds</text>
        <text x="90" y="522" fill="#94a3b8" font-size="10">pm.max_requests             recycle, leak insurance</text>

        <rect x="520" y="400" width="420" height="150" rx="8" fill="#0f172a"/>
        <rect x="520" y="400" width="420" height="150" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="730" y="428" fill="#fb7185" font-size="12" font-weight="600" text-anchor="middle">the two failure modes</text>
        <text x="550" y="458" fill="#94a3b8" font-size="10">too LOW: max_children_reached climbs, requests</text>
        <text x="550" y="474" fill="#94a3b8" font-size="10">queue, latency explodes while CPU sits idle</text>
        <text x="550" y="502" fill="#94a3b8" font-size="10">too HIGH: children exceed RAM, the box swaps or</text>
        <text x="550" y="518" fill="#94a3b8" font-size="10">the OOM killer eats a worker mid-request</text>
        <text x="550" y="540" fill="#fb7185" font-size="9">watch: listen queue + max children reached, both on the dashboard</text>
      </svg>
    </div>

    <p class="footer">scaling-php demo - PHP-FPM pool sizing</p>
  </div>
</body>
</html>
