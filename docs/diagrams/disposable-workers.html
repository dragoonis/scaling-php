<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disposable Workers</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #fb923c; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Disposable Workers</h1>
      </div>
      <p class="subtitle">Long-running PHP leaks memory eventually - so both runtimes recycle workers on purpose</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 520">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <rect x="60" y="60" width="400" height="180" rx="8" fill="#0f172a"/>
        <rect x="60" y="60" width="400" height="180" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="260" y="90" fill="white" font-size="13" font-weight="600" text-anchor="middle">PHP-FPM</text>
        <rect x="85" y="110" width="350" height="36" rx="4" fill="#020617" stroke="#164e63" stroke-width="1"/>
        <text x="260" y="133" fill="#22d3ee" font-size="11" text-anchor="middle">pm.max_requests = 1000</text>
        <text x="260" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">child serves 1000 requests,</text>
        <text x="260" y="188" fill="#94a3b8" font-size="9" text-anchor="middle">then the master kills it and forks a fresh one</text>
        <text x="260" y="216" fill="#22d3ee" font-size="8" text-anchor="middle">docker/fpm.conf</text>

        <rect x="540" y="60" width="400" height="180" rx="8" fill="#0f172a"/>
        <rect x="540" y="60" width="400" height="180" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="740" y="90" fill="white" font-size="13" font-weight="600" text-anchor="middle">Laravel Octane</text>
        <rect x="565" y="110" width="350" height="36" rx="4" fill="#020617" stroke="#065f46" stroke-width="1"/>
        <text x="740" y="133" fill="#34d399" font-size="11" text-anchor="middle">octane:frankenphp --max-requests=N</text>
        <text x="740" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">worker serves N requests,</text>
        <text x="740" y="188" fill="#94a3b8" font-size="9" text-anchor="middle">then Octane restarts it with a fresh app instance</text>
        <text x="740" y="216" fill="#34d399" font-size="8" text-anchor="middle">docker-compose.yml</text>

        <line x1="260" y1="240" x2="260" y2="298" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="740" y1="240" x2="740" y2="298" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <rect x="200" y="300" width="600" height="90" rx="8" fill="#0f172a"/>
        <rect x="200" y="300" width="600" height="90" rx="8" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="500" y="335" fill="white" font-size="14" font-weight="600" text-anchor="middle">Same principle, both runtimes:</text>
        <text x="500" y="360" fill="#fb923c" font-size="12" font-weight="600" text-anchor="middle">a leak cannot grow forever if the worker does not live forever</text>
        <text x="500" y="378" fill="#94a3b8" font-size="8" text-anchor="middle">recycling is graceful: the request in flight finishes, then the worker is replaced</text>

        <text x="500" y="440" fill="#94a3b8" font-size="9" text-anchor="middle">watch it live: make fpm-htop during load (PIDs churn as children recycle)</text>
        <text x="500" y="458" fill="#94a3b8" font-size="9" text-anchor="middle">or press r in ember - Octane workers restart under load with zero dropped requests</text>
      </svg>
    </div>

    <p class="footer">scaling-php demo - worker lifecycle management</p>
  </div>
</body>
</html>
