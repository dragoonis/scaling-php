<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runtime Benchmark</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #34d399; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Same Laravel App, Three Runtimes</h1>
      </div>
      <p class="subtitle">GET /products/{id} - 50 VUs for 30s per runtime - zero failed requests</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 560">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <text x="60" y="50" fill="white" font-size="13" font-weight="600">Requests per second</text>
        <line x1="60" y1="240" x2="940" y2="240" stroke="#334155" stroke-width="1"/>

        <rect x="100" y="192" width="200" height="48" rx="4" fill="rgba(8, 51, 68, 0.6)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="200" y="182" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="middle">723 rps</text>
        <text x="200" y="262" fill="white" font-size="11" font-weight="600" text-anchor="middle">PHP-FPM :8088</text>
        <text x="200" y="278" fill="#94a3b8" font-size="8" text-anchor="middle">nginx + process pool, boots app per request</text>

        <rect x="400" y="199" width="200" height="41" rx="4" fill="rgba(120, 53, 15, 0.5)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="500" y="189" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle">618 rps</text>
        <text x="500" y="262" fill="white" font-size="11" font-weight="600" text-anchor="middle">FrankenPHP classic :8080</text>
        <text x="500" y="278" fill="#94a3b8" font-size="8" text-anchor="middle">threads, still boots app per request</text>

        <rect x="700" y="72" width="200" height="168" rx="4" fill="rgba(6, 78, 59, 0.6)" stroke="#34d399" stroke-width="1.5"/>
        <text x="800" y="62" fill="#34d399" font-size="18" font-weight="700" text-anchor="middle">2,516 rps</text>
        <text x="800" y="262" fill="white" font-size="11" font-weight="600" text-anchor="middle">Octane worker :8081</text>
        <text x="800" y="278" fill="#94a3b8" font-size="8" text-anchor="middle">app booted once, kept warm in memory</text>

        <text x="60" y="330" fill="white" font-size="13" font-weight="600">Average latency</text>
        <line x1="60" y1="480" x2="940" y2="480" stroke="#334155" stroke-width="1"/>

        <rect x="100" y="342" width="200" height="138" rx="4" fill="rgba(8, 51, 68, 0.6)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="200" y="416" fill="#22d3ee" font-size="16" font-weight="700" text-anchor="middle">69 ms</text>
        <text x="200" y="500" fill="#94a3b8" font-size="9" text-anchor="middle">p95: 96 ms</text>

        <rect x="400" y="319" width="200" height="161" rx="4" fill="rgba(120, 53, 15, 0.5)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="500" y="404" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle">81 ms</text>
        <text x="500" y="500" fill="#94a3b8" font-size="9" text-anchor="middle">p95: 91 ms</text>

        <rect x="700" y="440" width="200" height="40" rx="4" fill="rgba(6, 78, 59, 0.6)" stroke="#34d399" stroke-width="1.5"/>
        <text x="800" y="430" fill="#34d399" font-size="18" font-weight="700" text-anchor="middle">20 ms</text>
        <text x="800" y="500" fill="#94a3b8" font-size="9" text-anchor="middle">p95: 27 ms</text>

        <text x="800" y="30" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">3.5x throughput</text>
      </svg>
    </div>

    <p class="footer">scaling-php demo - measured with k6 on one machine, all containers on the same docker host</p>
  </div>
</body>
</html>
